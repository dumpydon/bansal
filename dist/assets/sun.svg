<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Warm Jaipur sunlight</title>
  <defs>
    <radialGradient id="sunlight" cx="43%" cy="39%" r="73%">
      <stop stop-color="#fff3ca"/>
      <stop offset=".46" stop-color="#f8dfab"/>
      <stop offset=".8" stop-color="#efcd96"/>
      <stop offset="1" stop-color="#e9c087"/>
    </radialGradient>
    <clipPath id="sun-limb"><circle cx="128" cy="128" r="127.5"/></clipPath>
    <filter id="sun-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <g clip-path="url(#sun-limb)">
    <circle cx="128" cy="128" r="128" fill="url(#sunlight)"/>
    <rect width="256" height="256" filter="url(#sun-paper)" opacity=".035"/>
    <circle cx="128" cy="128" r="127" fill="none" stroke="#fff5d8" stroke-opacity=".5" stroke-width="1"/>
  </g>
</svg>
